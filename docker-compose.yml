version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WEB_CACHE_ENABLED: "1"
      REDIS_URL: redis://redis:6379/0
      WEB_CACHE_TTL_SECONDS: "60"
      QWEN_TIMEOUT_SECONDS: "150"
    volumes:
      - ./.novel2script:/app/.novel2script
    depends_on:
      - redis
    expose:
      - "8098"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis-data:
