        type: action
        text: c003（周也）：好。但你也要去。
        emotion: ''
      - beat_id: b035
        type: action
        text: 陈知律沉默。
        emotion: ''
      - beat_id: b036
        type: dialogue
        text: （轻声）好。
        speaker_ref: c001
        emotion: ''
      - beat_id: b037
        type: action
        text: 周也把巧克力盒往他怀里推了推。
        emotion: ''
      - beat_id: b038
        type: action
        text: c003（周也）：走吧。趁我现在还有勇气，别让我后悔。
        emotion: ''
      - beat_id: b039
        type: action
        text: 傍晚。外面天光正变成温暖的金红色，法国梧桐排列整齐，叶子的边缘被夕阳照亮，像薄薄的金箔。空气里飘来糖炒栗子和桂花香。
        emotion: ''
      - beat_id: b040
        type: action
        text: 陈知律和周也并肩沿着种满梧桐的路慢慢走着。两个人的步伐不快不慢，中间隔着半个手臂的距离。周也的手插在外套口袋里，陈知律的手里攥着那块还没吃完的巧克力。
        emotion: ''
      - beat_id: b041
        type: action
        text: 心禾心理的玻璃门上，招聘启事还在原处。但旁边多了一张手写的便签——字迹娟秀——写着：“我们都在努力活着，这已经很了不起了。”
        emotion: ''
      - beat_id: b042
        type: action
        text: 陈知律在那行字前停住了。他微微仰着头，目光落在那些字上。周也站在他旁边，没有催他。夕阳将两人的影子拉得很长很长，几乎叠在一起，融成一道没有分界的暗色。
        emotion: ''
      - beat_id: b043
        type: action
        text: 心禾心理的招牌亮了。暖黄色的光透过玻璃门洒在台阶上，像一扇敞开的门。陈知律深吸一口气，抬手推开了门。
        emotion: ''
      - beat_id: b044
        type: action
        text: 走廊尽头，暖黄色的光洒出来，微弱却坚定。身后的梧桐叶在风中沙沙作响，像是某种古老的、善意的声音。
        emotion: ''
      - beat_id: b045
        type: dialogue
