        type: action
        text: c003（周也）：（头也不回）闭嘴，我没有你这么大的儿子。
        emotion: ''
      - beat_id: b024
        type: action
        text: 陈知律嘴角微微动了动，那个弧度很小很淡，像冬天窗玻璃上结的霜花。
        emotion: ''
      - beat_id: b025
        type: action
        text: 周也塞完东西，从袋子底部掏出一盒巧克力。她转过身，把巧克力递给他。
        emotion: ''
      - beat_id: b026
        type: action
        text: c003（周也）：林老师让我带给你的。她说——“给那个孩子吃点甜的。”
        emotion: ''
      - beat_id: b027
        type: action
        text: 陈知律接过巧克力，拆开包装，掰了一小块放进嘴里。他咀嚼的动作很慢，舌尖上的甜味和一丝苦味交织。
        emotion: ''
      - beat_id: b028
        type: dialogue
        text: （含含糊糊地）周也。
        speaker_ref: c001
        emotion: ''
      - beat_id: b029
        type: action
        text: c003（周也）：嗯？
        emotion: ''
      - beat_id: b030
        type: dialogue
        text: 你之前说，你失眠。
        speaker_ref: c001
        emotion: ''
