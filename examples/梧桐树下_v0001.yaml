    - scene_id: s010
      title: 梧桐树下
      chapter_refs:
      - ch10
      time_of_day: 傍晚
      objective: 睡了很久的觉，把那个租了一年却从没好好用过的电饭…
      summary: 陈知律请假三天后，周也闯入他的家，两人达成一个约定，随后一起走向心禾心理。
      beats:
      - beat_id: b001
        type: action
        text: 陈知律的出租屋，光线昏暗。窗帘没拉严，一道灰白的光线落在堆满衣服的椅背上。他穿着一件皱巴巴的T恤坐在出租屋的小餐桌前，桌上的电饭煲正冒着蒸汽，厨房里传来粥沸腾的声音，很快变成一种即将溢出的咕嘟声。他没有任何反应。
        emotion: ''
      - beat_id: b002
        type: dialogue
        text: （低声自语）……
        speaker_ref: c001
        emotion: ''
      - beat_id: b003
        type: narration
        text: 陈知律请了三天假。这是第三天。前两天的内容大致相同——睡觉，发呆，不接电话，不看消息。
        emotion: ''
      - beat_id: b004
        type: action
        text: 粥沸腾的声音突然变成了焦味。陈知律仿佛刚回过神，起身走向厨房，拔掉电源。他揭开锅盖，白粥表面平静，但锅底显然已经焦黑。
        emotion: ''
      - beat_id: b005
        type: action
        text: 他面无表情地拿碗，把上面没糊的部分盛出来，厨房里弥漫着焦米味，隐约参杂着一点点米香。他就这样站在灶台前，就着一包榨菜，吃了两口，然后慢慢吃完一整碗，又盛了第二碗。
        emotion: ''
      - beat_id: b006
        type: action
        text: 吃完后，他洗了碗和锅，把电饭煲擦干，放回橱柜里。然后他拿起手机，看了一眼屏幕，拨出电话。
        emotion: ''
      - beat_id: b007
        type: dialogue
        text: 妈。
        speaker_ref: c001
        emotion: ''
      - beat_id: b008
        type: dialogue
        text: （声音比之前清晰一些）嗯。
