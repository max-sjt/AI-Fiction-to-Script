      - beat_id: b040
        type: action
        text: 陈知律把嘴里的面咽下去，手指悬在屏幕上方。停顿了几秒。然后他按下一个键，发送。
        emotion: ''
      - beat_id: b041
        type: action
        text: 'CUT TO:'
