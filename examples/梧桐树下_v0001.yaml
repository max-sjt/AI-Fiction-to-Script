    - scene_id: s003
      title: 食堂里的周也
      chapter_refs:
      - ch03
      time_of_day: noon
      objective: 他不习惯那种太热烈的、几乎没有边界感的关系，但也…
      summary: 周也再次用自己的方式，闯入陈知律封闭的世界
      beats:
      - beat_id: b001
        type: action
        text: 中午的大学食堂，人声嘈杂。陈知律端着餐盘走进来，目光扫过人群。靠窗的位置，周也穿着一件亮橙色卫衣，高马尾，正举着一只手臂用力挥动。桌上已经摆了两份饭菜，她的那份已经吃掉一半
        emotion: ''
      - beat_id: b002
        type: dialogue
        text: “这里！陈知律，这边！”
        speaker_ref: c002
        emotion: ''
      - beat_id: b003
        type: action
        text: 陈知律犹豫了一秒，朝那个方向走过去。周围的几桌学生看了一眼周也，又看了一眼陈知律，目光里带着一种习以为常的好奇
        emotion: ''
      - beat_id: b004
        type: action
        text: 陈知律在周也对面的椅子上坐下，把餐盘放到一旁。周也立刻把另一份饭推到他的面前
        emotion: ''
      - beat_id: b005
        type: dialogue
        text: “你瘦了。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b006
        type: dialogue
        text: “你跟我妈说的一样。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b007
        type: action
        text: “那说明是真的。” 周也用筷子指了指盘子，“吃。我看着你吃完。”
        emotion: ''
      - beat_id: b008
        type: action
        text: 陈知律低头看了一眼盘子里的菜——红烧排骨、清炒西兰花、一碗紫菜蛋花汤，都是他平时会点的。他拿起筷子夹了一块排骨，动作很慢
        emotion: ''
      - beat_id: b009
        type: action
        text: 周也咬着筷子，看着他吃了两口，目光一直没移开。陈知律感觉到那种注视，但没有抬头
        emotion: ''
      - beat_id: b010
        type: dialogue
        text: “你自己不吃？”
        speaker_ref: c001
        emotion: ''
      - beat_id: b011
        type: dialogue
        text: “我减肥。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b012
        type: dialogue
        text: “你不需要减肥。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b013
        type: dialogue
        text: “哇，这算是关心吗？”
        speaker_ref: c002
        emotion: ''
      - beat_id: b014
        type: action
        text: 陈知律没有接话，继续吃饭。周也的笑容淡了一瞬，但很快又亮起来。她忽然放下筷子，正色坐直
        emotion: ''
      - beat_id: b015
        type: dialogue
        text: “陈知律，我跟你说个事。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b016
        type: dialogue
        text: “说。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b017
        type: dialogue
        text: “我也报了明德的研究生。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b018
        type: action
        text: 陈知律的动作停住了，筷子悬在半空。他抬起眼睛看向周也
        emotion: ''
      - beat_id: b019
        type: dialogue
        text: “同专业？”
        speaker_ref: c001
        emotion: ''
      - beat_id: b020
        type: dialogue
        text: “同方向。” 周也的眼睛亮晶晶的，带着一种明知山有虎偏向虎山行的得意，“以后咱俩又是同学。惊不惊喜？意不意外？”
        speaker_ref: c002
        emotion: ''
      - beat_id: b021
        type: action
        text: 陈知律沉默了几秒。他重新低下头，夹了一筷子西兰花，嚼了两下才开口
        emotion: ''
      - beat_id: b022
        type: dialogue
        text: “你本科成绩够保研的，为什么还要考？”
        speaker_ref: c001
        emotion: ''
      - beat_id: b023
        type: action
        text: 周也的笑容僵了大约零点几秒。那段时间很短，短到食堂里任何一个人都不会注意到，但陈知律看到了她眼里的光闪了一下又恢复
        emotion: ''
      - beat_id: b024
        type: dialogue
        text: “因为我乐意。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b025
        type: narration
        text: 她没有说的是，保研名额被系主任的侄子挤掉了。她也没有说的是，考研报名截止的最后一天，她把志愿从北方某985改成了明德——只是因为那天晚上陈知律发了一条朋友圈，一张心禾心理门口的法国梧桐照片，配文是一个句号。那是他三年来的第一条朋友圈
        emotion: ''
      - beat_id: b026
        type: action
        text: 周也从包里抽出一张纸，拍在桌上。是一份录取函的复印件，动作和那天陈知律把录取函拍在母亲面前时如出一辙
        emotion: ''
      - beat_id: b027
        type: dialogue
        text: “以后请叫我周也同学。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b028
        type: action
        text: 陈知律低头看着那张复印件，目光在“明德大学心理学硕士”那一行字上停留了片刻。他的嘴角微微动了一下
        emotion: ''
      - beat_id: b029
        type: narration
        text: 那不算一个完整的笑容，更像是某种被压制的情绪不小心从裂缝里泄露出来。但周也看见了。她觉得这一个微小的弧度，比任何大笑都值得
        emotion: ''
      - beat_id: b030
        type: action
        text: 周也迅速举起手机，对准陈知律拍了一张
        emotion: ''
      - beat_id: b031
        type: dialogue
        text: “删掉。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b032
        type: dialogue
        text: “不删。” 周也把手机揣回卫衣口袋里，笑眯眯地拿起筷子，“这张我要留着，以后等你出名了卖给八卦记者。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b033
        type: action
        text: 食堂里人来人往，嘈杂的声音在头顶汇成一片嗡嗡的声浪。陈知律低下头继续吃饭，耳尖有一点不易察觉的红。他不知道自己在脸红什么——可能是因为周也的笑容太亮了，亮到他有些不适应，而他已经很久没有被一束光照过
        emotion: ''
      - beat_id: b034
        type: action
        text: 周也低头扒了两口饭，忽然又抬起头，眼睛弯弯地看着他
        emotion: ''
      - beat_id: b035
        type: dialogue
        text: “对了，心禾心理怎么样？有没有漂亮女同事？”
        speaker_ref: c002
        emotion: ''
      - beat_id: b036
        type: dialogue
        text: “……吃饭。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b037
        type: dialogue
        text: “你脸红了。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b038
        type: dialogue
        text: “没有。”
        speaker_ref: c001
        emotion: ''
      - beat_id: b039
        type: dialogue
        text: “有。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b040
        type: action
        text: 陈知律不再说话，把最后一块排骨塞进嘴里，端起餐盘站起来。周也冲着他的背影喊了一声
        emotion: ''
      - beat_id: b041
        type: dialogue
        text: “明天还这个点！我给你占座！”
        speaker_ref: c002
        emotion: ''
      - beat_id: b042
        type: action
        text: 陈知律没有回头，但他的脚步顿了一下，然后才继续往前走
        emotion: ''
      transitions:
        next_scene_hint: 切至
        transition_type: cut
