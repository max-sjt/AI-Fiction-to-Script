    - scene_id: s009
      title: 临界点
      chapter_refs:
      - ch09
      time_of_day: day
      objective: 而是在一个最普通、最没有仪式感的时刻——他在超市…
      summary: 十一月的最后一周，陈知律在一个普通超市的泡面货架前彻底崩溃。他在拨出那通电话之后，终于在周也面前承认“我可能也不行”。
      beats:
      - beat_id: b001
        type: action
        text: 'ACTION:'
        emotion: ''
      - beat_id: b002
        type: action
        text: 深秋午后，一家普通社区超市。日光灯管发出嗡嗡的低频震动。陈知律站在泡面货架前，身上穿着那件洗得发白的深蓝色卫衣，衣领松松垮垮。他目光落在第三层货架上那排整齐的红烧牛肉面包装上，缓缓伸出手。
        emotion: ''
      - beat_id: b003
        type: narration
        text: 手指够到了泡面的边缘。这一周他都睡得很少，他以为只要熬过周三下午就好——但他不知道身体从来不懂得讨价还价。
        emotion: ''
      - beat_id: b004
        type: action
        text: 陈知律的手指屈起，想捏住那包泡面。但指节像被抽走了力气，只是徒劳地碰了碰塑料包装的表面。他试着用力，整只手开始轻微发抖，那包泡面晃了晃，从货架上滑落，啪地掉在地上。
        emotion: ''
      - beat_id: b005
        type: action
        text: 陈知律低头看着地上的泡面。他蹲下身去捡。可当他蹲下去之后，膝盖像焊在了地砖上。他站不起来了。
        emotion: ''
      - beat_id: b006
        type: action
        text: 'c003 (工作人员，画外音): 先生？需要帮忙吗？'
        emotion: ''
      - beat_id: b007
        type: action
        text: 陈知律没有回答。他蹲在过道中央，双手垂在膝盖两侧，视线落在地砖缝隙里一粒灰色的污渍上。周围有购物车轮碾过的声音，有小孩跑过的脚步，有人好奇地回头看了他一眼又走开。他全听见了，又像什么也没听见。
        emotion: ''
      - beat_id: b008
        type: narration
        text: 脑子里只有一个念头在循环播放，那把钝刀切了整整一个十一月，终于切到了神经末梢——“我不行了。”
        emotion: ''
      - beat_id: b009
        type: action
        text: 超市工作人员走到他身侧，弯下腰，声音放低了。
        emotion: ''
      - beat_id: b010
        type: action
        text: 'c003 (工作人员): 你是不是不舒服？要不要帮你叫个人？'
        emotion: ''
      - beat_id: b011
        type: action
        text: 陈知律的睫毛动了一下。他摇了摇头，很慢，很吃力。然后他按住货架的金属隔板，一截一截把自己撑了起来。他推开空购物车往出口走，购物车被放在门口的铁架上，发出一声金属碰撞的闷响。
        emotion: ''
      - beat_id: b012
        type: narration
        text: 那声闷响，和心电监护仪的滴滴声完全不同。但同样让他想起医院。
        emotion: ''
      - beat_id: b013
        type: action
        text: 陈知律走出超市，没有结账。他在门口的台阶上坐下来。右手边放着一包他始终没有力气捏住的泡面。他掏出手机，翻到通讯录，手指在一个名字上停了很久，然后按了下去。
        emotion: ''
      - beat_id: b014
        type: dialogue
        text: 周也。
        speaker_ref: c001
        emotion: ''
      - beat_id: b015
        type: action
        text: 'c002 (周也): 嗯？'
        emotion: ''
      - beat_id: b016
        type: narration
        text: 她的声音带着刚睡醒的沙哑，和一点点被吵醒之后还没来得及收起来的烦躁。
        emotion: ''
      - beat_id: b017
        type: dialogue
        text: 你能来一下吗？
        speaker_ref: c001
        emotion: ''
      - beat_id: b018
        type: action
        text: 电话那头安静了两秒。
        emotion: ''
      - beat_id: b019
        type: action
        text: 'c002 (周也): 你在哪？'
        emotion: ''
      - beat_id: b020
        type: action
        text: 周也到的时候，陈知律还坐在超市门口的台阶上。他穿着那件深蓝色卫衣，衣领下露出锁骨一小截苍白的皮肤。他的瞳孔没有焦点，像一台焦距没调好的相机。周也在他旁边坐下来，没有问任何问题。
        emotion: ''
      - beat_id: b021
        type: action
        text: 深秋的风把落叶卷成一团又散开。他们并排坐在台阶上，像两个无家可归的人。过了很久，大概十分钟，陈知律开口了。他的声音很平静，平静得不像在承认一件天大的事。
        emotion: ''
      - beat_id: b022
        type: dialogue
        text: 周也，我可能也不行。
        speaker_ref: c001
        emotion: ''
      - beat_id: b023
        type: action
        text: 'c002 (周也): 我知道。'
        emotion: ''
      - beat_id: b024
        type: narration
        text: 她听懂了那个“也”字。他在承认自己和她一样——是一个需要被接住的人。
        emotion: ''
      - beat_id: b025
        type: action
        text: 'c002 (周也): 我都知道。'
        emotion: ''
      - beat_id: b026
        type: action
        text: 陈知律转过头来看她。路灯刚刚亮起来，橘黄色的光落在他眼睛里，像碎掉的玻璃。他的嘴唇动了几下，像是想说什么，但最后只发出很轻的声音。
        emotion: ''
      - beat_id: b027
        type: dialogue
        text: 我能靠一下吗？
        speaker_ref: c001
        emotion: ''
      - beat_id: b028
        type: action
        text: 周也的眼泪一瞬间就掉下来了。她使劲点头，往他的方向挪了挪。陈知律把头靠在她肩上，闭上了眼睛。
        emotion: ''
      - beat_id: b029
        type: narration
        text: 他的身体很僵硬，像一块绷了太久的铁板。即使靠下来的那一刻也没有完全放松，但他正在努力——周也感觉到肩上传来微微的颤抖。不是哭泣，更像一台过载太久的机器终于被人按下了关机键，所有部件都在缓慢而不协调的惯性里发出最后的嗡鸣。
        emotion: ''
      - beat_id: b030
        type: action
        text: 街上人来人往。一个穿校服的中学生踩着滑板从他们面前滑过，耳机里的音乐漏出来，是一个女声在唱“我也曾经这样过，在人群里藏起脆弱”。
        emotion: ''
      - beat_id: b031
        type: action
        text: 周也的眼泪流了很长时间，但没发出任何声音。她一只手握着陈知律的手，另一只手掏出手机，单手打字给林静发了一条消息。
        emotion: ''
      - beat_id: b032
        type: narration
        text: “林老师，陈知律可能需要休息几天。”
        emotion: ''
      - beat_id: b033
        type: action
        text: 几秒钟后屏幕亮了。
        emotion: ''
      - beat_id: b034
        type: dialogue
        text: 好的。
        speaker_ref: c003
        emotion: ''
      - beat_id: b035
        type: dialogue
        text: 他也该了。
        speaker_ref: c003
        emotion: ''
      transitions:
