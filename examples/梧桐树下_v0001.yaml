    conflict: 周也突然出现在心禾心理，用一杯奶茶和一份简历把自己塞进了陈知律的实习生活。她发现他手指在发抖，但假装没看见。
    notes: 周也突然出现在心禾心理，用一杯奶茶和一份简历把自己塞进了陈知律的实习生活。她发现他手指在发抖，但假装没看见。
    focus_event: 心禾心理咨询中心前台区域。空间不大，前台桌面上堆着几本专业期刊和一台老式座机。墙上挂着心理咨询师的资质证书。下午的光线透过百叶窗在木地板上留下斜纹。周也推门进来，手里拎着两杯奶茶，探头看了看四周。
    bridge_in: ''
    bridge_out: ''
  - scene_id: s009
    act_id: main
    title: 临界点
    objective: 而是在一个最普通、最没有仪式感的时刻——他在超市…
    chapter_refs:
    - ch09
    conflict: 十一月的最后一周，陈知律在一个普通超市的泡面货架前彻底崩溃。他在拨出那通电话之后，终于在周也面前承认“我可能也不行”。
    notes: 十一月的最后一周，陈知律在一个普通超市的泡面货架前彻底崩溃。他在拨出那通电话之后，终于在周也面前承认“我可能也不行”。
    focus_event: 'ACTION:'
    bridge_in: ''
    bridge_out: ''
  - scene_id: s010
    act_id: main
    title: 梧桐树下
    objective: 睡了很久的觉，把那个租了一年却从没好好用过的电饭…
    chapter_refs:
    - ch10
    conflict: 陈知律请假三天后，周也闯入他的家，两人达成一个约定，随后一起走向心禾心理。
    notes: 陈知律请假三天后，周也闯入他的家，两人达成一个约定，随后一起走向心禾心理。
    focus_event: 陈知律的出租屋，光线昏暗。窗帘没拉严，一道灰白的光线落在堆满衣服的椅背上。他穿着一件皱巴巴的T恤坐在出租屋的小餐桌前，桌上的电饭煲正冒着蒸汽，厨房里传来粥沸腾的声音，很快变成一种即将溢出的咕嘟声。他没有任何反应。
    bridge_in: ''
    bridge_out: ''
script:
  acts:
  - act_id: main
    title: 正文
    scenes:
    - scene_id: s001
      title: 不能停下来
      chapter_refs:
      - ch01
      time_of_day: 日
      objective: 靠窗的病床上躺着一个瘦削的中年女人，头发稀疏，脸…
      summary: 陈知律攥着明德大学研究生录取函站在医院走廊尽头，推开病房门，面对病重的母亲。母亲坚持要他去读研，无论学费有多难。
      beats:
      - beat_id: b001
        type: action
        text: 明德大学附属医院，午间。走廊很长，日光灯管把白色墙壁照得惨白。消毒水的气味浓烈，像一层看不见的薄膜覆住一切。偶尔有护士推着小车经过，车轮碾过地面发出细碎声响。陈知律站在走廊尽头，手里攥着那份烫金录取函，指尖微微发白。
        emotion: ''
      - beat_id: b002
        type: dialogue
        text: 陈知律
        speaker_ref: c001
        emotion: ''
      - beat_id: b003
        type: action
        text: 他低头看着录取函上“明德大学”四个烫金字，目光停留很久。走廊另一端传来心电监护的滴滴声，规律的、机械的，像某种古老的计时器。他深吸一口气，将录取函塞进外套内袋，推开走廊尽头那扇门。
        emotion: ''
      - beat_id: b004
        type: action
        text: 病房里很安静。窗帘半拉着，阳光斜照进来，在白色床单上投下一道光影。心电监护的绿线在屏幕上规律地跳动。靠窗的病床上躺着一个瘦削的中年女人，头发稀疏，脸色蜡黄，嘴唇干裂起皮。她的眼睛是亮的。看见陈知律进来，她撑着手臂想要坐起来，动作迟缓，像被什么东西拽住了身体。
        emotion: ''
      - beat_id: b005
        type: dialogue
        text: 陈母
        speaker_ref: c002
        emotion: ''
      - beat_id: b006
        type: action
        text: （声音有些虚弱）
        emotion: ''
      - beat_id: b007
        type: action
        text: 知律。
        emotion: ''
      - beat_id: b008
        type: action
        text: （快步走过去，按住母亲的肩膀）
        emotion: ''
      - beat_id: b009
        type: action
        text: 别动。
        emotion: ''
      - beat_id: b010
        type: action
        text: （勉强笑了笑）
        emotion: ''
      - beat_id: b011
        type: action
        text: 没事，就是躺久了，骨头都硬了。
        emotion: ''
      - beat_id: b012
        type: action
        text: 陈知律没接话。他从床头柜上拿起保温杯，拧开盖子，倒出一杯温水递过去。陈母接过杯子，双手微微发颤，水面上漾起细小的波纹。她抿了一口，又把杯子放下，重新靠回枕头上，目光始终没有离开儿子的脸。
        emotion: ''
      - beat_id: b013
        type: action
        text: 你瘦了。
        emotion: ''
      - beat_id: b014
        type: action
        text: 你每次都这么说。
        emotion: ''
      - beat_id: b015
        type: action
        text: 陈知律拉过一把折叠椅，在床边坐下。他顺手整理了一下床头柜上散落的药盒，按服用时间重新排好——早晚中的顺序，整齐地码成一排。帕罗西汀、米氮平、劳拉西泮。药名他背得比专业课还熟。
        emotion: ''
      - beat_id: b016
        type: action
        text: （声音很轻，像怕惊动什么）
        emotion: ''
      - beat_id: b017
        type: action
        text: 这次是真的瘦了。眼睛里都有红血丝了，昨晚又熬夜了？
        emotion: ''
      - beat_id: b018
        type: action
        text: （没否认，也没承认）
        emotion: ''
      - beat_id: b019
        type: action
        text: 妈。
        emotion: ''
      - beat_id: b020
        type: action
        text: （声音压得很低）
        emotion: ''
      - beat_id: b021
        type: action
        text: 我跟你说个事。
        emotion: ''
      - beat_id: b022
        type: action
        text: 陈母的手指微微蜷了一下，指尖扣在床单上。陈知律从内袋抽出那份录取函，展开，递过去。烫金的校徽在日光灯下闪了一下光，上面印着一行字——兹录取陈知律同学为明德大学应用心理系2024级硕士研究生。
        emotion: ''
      - beat_id: b023
        type: action
        text: 陈母接过录取函，看了很久。她的手指摩挲着那个烫金校徽，指腹一遍遍划过那行字。嘴唇动了动，眼眶慢慢泛红。
        emotion: ''
      - beat_id: b024
        type: action
        text: （声音有些哽咽，但嘴角是上扬的）
        emotion: ''
      - beat_id: b025
        type: action
        text: 我就知道。我就知道你一定能考上。
        emotion: ''
      - beat_id: b026
        type: action
        text: 陈知律没说话。他看着母亲泛红的眼眶，胸腔里像有什么东西堵着，上不来下不去。他张了张嘴，想说点什么，但又觉得说什么都不太对。说“我考上了”太轻巧，说“你别担心钱”又太假——因为他自己都还没想清楚钱从哪里来。
        emotion: ''
      - beat_id: b027
        type: action
        text: （念着校名，语气里带着近乎虔诚的郑重）
        emotion: ''
      - beat_id: b028
        type: action
        text: 明德大学。你爸要是还在，肯定高兴坏了。
        emotion: ''
      - beat_id: b029
        type: action
        text: 陈知律垂下眼。病床上方的心电监护滴滴地响着，走廊上传来护士的脚步声，由远及近，又由近及远。一阵短暂的沉默。陈母慢慢将录取函折好，递还给儿子，动作小心翼翼，像在传递一件易碎的珍宝。
        emotion: ''
      - beat_id: b030
        type: action
        text: 去读。
        emotion: ''
      - beat_id: b031
        type: action
        text: 学费——
        emotion: ''
      - beat_id: b032
        type: action
        text: 我来想办法。
        emotion: ''
      - beat_id: b033
        type: action
        text: （抬起头，直视母亲的眼睛）
        emotion: ''
      - beat_id: b034
        type: action
        text: 你怎么想办法？你这病不能停药，每个月光药费就要两千多。舅舅上个月给的那笔钱已经——
        emotion: ''
      - beat_id: b035
        type: action
        text: （忽然叫了全名，声音不大，却像一根针扎进他的话里）
        emotion: ''
      - beat_id: b036
        type: action
        text: 陈知律。
        emotion: ''
      - beat_id: b037
        type: action
        text: 陈知律停住了。母亲看着他，目光平静，却带着一种不容置疑的力量。她的手指还在微微发抖，但语气稳定，每个字都说得很清楚。
        emotion: ''
      - beat_id: b038
        type: action
        text: 你今年二十二了。你从十六岁开始，一边上学一边打工，照顾了我六年。六年。
        emotion: ''
      - beat_id: b039
        type: action
        text: （顿了顿）
        emotion: ''
      - beat_id: b040
        type: action
        text: 你十八岁的时候，我说等你考上大学就好了。你考上了。你二十岁的时候，我说等你毕业就好了。你毕业了。现在你二十二岁，考上了研究生，你还要等什么？
        emotion: ''
      - beat_id: b041
        type: action
        text: （喉结动了一下）
        emotion: ''
      - beat_id: b042
        type: action
        text: 妈，我不是——
        emotion: ''
      - beat_id: b043
        type: action
        text: 我知道你不是在怪自己。但我是在怪我自己。
        emotion: ''
      - beat_id: b044
        type: action
        text: 陈母说完这句话，转开脸看向窗外。窗外那棵梧桐树的叶子在风里晃动，光影投射在窗帘上，忽明忽灭。陈知律坐在床边，双手交叉放在膝盖上，十指用力扣在一起。
        emotion: ''
      - beat_id: b045
        type: action
        text: （沉默片刻）
        emotion: ''
      - beat_id: b046
        type: action
        text: 学费一年两万五。加上生活费、书本费，一年至少三万五。我算过，就算我做两份兼职，顶多能凑出一半。
        emotion: ''
      - beat_id: b047
        type: action
        text: （转回头）
        emotion: ''
      - beat_id: b048
        type: action
        text: 你舅舅那边——
        emotion: ''
      - beat_id: b049
        type: action
        text: 妈，舅舅上个月给的那笔钱，你说借的，我知道是给的。他已经帮了很多了。我不能一直在他的脸面上活着。
        emotion: ''
      - beat_id: b050
        type: action
        text: （眼神忽然锐利起来）
        emotion: ''
      - beat_id: b051
        type: action
        text: 那你打算怎么办？不读了？回那个快递站接着打包，一个月三千五，够我们娘俩吃几顿饭？
        emotion: ''
      - beat_id: b052
        type: action
        text: 我没说不读。我只是说，我再想想办法。
        emotion: ''
      - beat_id: b053
        type: action
        text: 你不用想办法。我已经想过办法了。
        emotion: ''
      - beat_id: b054
        type: action
        text: 陈知律骤然抬头，目光里闪过一丝警觉。他看着母亲平静的脸色，眉头慢慢皱起来。
        emotion: ''
      - beat_id: b055
        type: action
        text: 你做了什么？
        emotion: ''
      - beat_id: b056
        type: action
        text: 你林阿姨你还记得吗？就是以前住在咱们楼下的那个。
        emotion: ''
      - beat_id: b057
        type: action
        text: （警惕）
        emotion: ''
      - beat_id: b058
        type: action
        text: 记得。
        emotion: ''
      - beat_id: b059
        type: action
        text: 她女儿开了家心理咨询工作室，就在城南。我听她说，那边正缺人手。你要是能去那边实习，工资虽然不高，但总比快递站强。而且你学心理的，专业也对口。
        emotion: ''
      - beat_id: b060
        type: action
        text: （眼神微微一动）
        emotion: ''
      - beat_id: b061
        type: action
        text: 你什么时候跟你林阿姨联系的？
        emotion: ''
      - beat_id: b062
        type: action
        text: （避开了儿子的目光）
        emotion: ''
      - beat_id: b063
        type: action
        text: 就前几天。
        emotion: ''
      - beat_id: b064
        type: action
        text: 陈母没有回答。她把被子往上拉了拉，侧过身，背对儿子。病房里安静了几秒，只有心电监护的滴滴声和窗外风穿过树叶的沙沙声。
        emotion: ''
      - beat_id: b065
        type: dialogue
        text: 'E067: 陈母'
        speaker_ref: c002
        emotion: ''
      - beat_id: b066
        type: action
        text: （背对着他，声音闷闷的）
        emotion: ''
      - beat_id: b067
        type: action
        text: 我今天跟他们科室主任谈过了。他们说我可以申请转去日间病房，白天去输液，晚上回家住。这样能省一半住院费。
        emotion: ''
      - beat_id: b068
        type: action
        text: （一下子站起来，椅子被推得往后一滑，发出刺耳的声响）
        emotion: ''
      - beat_id: b069
        type: action
        text: 不行。
        emotion: ''
      - beat_id: b070
        type: action
        text: （转回身，语气平静）
        emotion: ''
      - beat_id: b071
        type: action
        text: 医生已经同意了。
        emotion: ''
      - beat_id: b072
        type: action
        text: （声音拔高）
        emotion: ''
      - beat_id: b073
        type: action
        text: 你知不知道你现在什么情况？转去日间病房，晚上
        emotion: ''
      transitions:
        next_scene_hint: 陈知律第二天早上八点四十就到了心禾心理。 玻璃门上挂着“休息中”的牌子，透过门缝能看到里面正在打扫的林静。
        transition_type: cut
      source_refs:
      - chapter_id: ch01
        excerpt_id: p001
    - scene_id: s002
      title: 心禾心理
      chapter_refs:
      - ch02
      time_of_day: day - night
      objective: 录入档案是一件机械而枯燥的工作，但陈知律做得极其…
      summary: 陈知律第一天实习，从机械的档案录入到旁观初始访谈，职业信念被林静一句话击中，深夜独自消化冲击。
      beats:
      - beat_id: b001
        type: action
        text: 清晨，心禾心理诊所门外的走廊。陈知律站在玻璃门前，身后是清晨稀疏的人流。门上挂着“休息中”的木牌。透过半透明玻璃，能看到林静正弯腰用抹布擦拭前台桌面，动作慢而专注。陈知律低头看了眼手机——8:42。他深吸一口气，把昨晚复习的心理学量表要点在脑中默念一遍，没有敲门，安静地站在门外。
        emotion: ''
      - beat_id: b002
        type: narration
        text: 他习惯提前到，也习惯等。这二十多分钟里，他把所有可能被问到的专业问题又过了一遍。
        emotion: ''
      - beat_id: b003
        type: action
        text: 九点整，木牌翻转为“营业中”。陈知律推门，门铃发出清脆的叮咚声。林静从里间走出来，手里端着一杯冒着热气的咖啡，咖啡的苦味瞬间弥漫开来。
        emotion: ''
      - beat_id: b004
        type: dialogue
        text: 还挺准时。
        speaker_ref: c002
        emotion: ''
      - beat_id: b005
        type: dialogue
        text: 林老师早。
        speaker_ref: c001
        emotion: ''
      - beat_id: b006
        type: action
        text: 林静上下打量了他一眼，没有多余寒暄，转身朝里走。
        emotion: ''
      - beat_id: b007
        type: dialogue
        text: 跟我来吧。
        speaker_ref: c002
        emotion: ''
      - beat_id: b008
        type: action
        text: 陈知律跟上。镜头跟随他们的脚步穿过狭窄走廊。墙壁刷成淡绿色，挂着几幅色调柔和的抽象画——海浪、远山、一只停在树枝上的鸟。三扇紧闭的咨询室门依次掠过。
        emotion: ''
      - beat_id: b009
        type: action
        text: 办公室内，林静从文件柜抽出几本厚重的文件夹，依次摊在桌上。纸张的旧味混着咖啡香。
        emotion: ''
      - beat_id: b010
        type: dialogue
        text: 这是来访者档案的归档模板，这是知情同意书的标准格式，这是初始访谈记录表。
        speaker_ref: c002
        emotion: ''
      - beat_id: b011
        type: action
        text: 她手指一一划过文件，语速平稳。
        emotion: ''
      - beat_id: b012
        type: dialogue
        text: 你第一周的工作就是把近两年的纸质档案全部电子化，录入我们的内部系统。有问题吗？
        speaker_ref: c002
        emotion: ''
      - beat_id: b013
        type: dialogue
        text: 没有。
        speaker_ref: c001
        emotion: ''
      - beat_id: b014
        type: action
        text: 林静端着杯子停在嘴边，抬眼看他。
        emotion: ''
      - beat_id: b015
        type: dialogue
        text: 别回答得这么快。
        speaker_ref: c002
        emotion: ''
      - beat_id: b016
        type: action
        text: 她放下杯子，凑近一步，目光锐利。
        emotion: ''
      - beat_id: b017
        type: dialogue
        text: 录入过程中你会看到所有来访者的个人信息和症状描述。所有内容一律不得外泄——包括对你最亲近的人。能做到吗？
        speaker_ref: c002
        emotion: ''
      - beat_id: b018
        type: action
        text: 陈知律迎上她的目光，没有任何闪躲。
        emotion: ''
      - beat_id: b019
        type: dialogue
        text: 能。
        speaker_ref: c001
        emotion: ''
      - beat_id: b020
        type: action
        text: 林静盯着他的眼睛看了两秒，点了下头。她弯腰从抽屉里拿出一份实习协议，推过桌面。陈知律没有犹豫，拿起笔签下名字。笔尖划过纸张的声音清晰可闻。
        emotion: ''
      - beat_id: b021
        type: action
        text: 从此，陈知律成了心禾心理年纪最小、话最少、走得最晚的实习生。档案录入工作开始。每份纸质档案发黄卷边，钢笔字迹或潦草或工整。陈知律坐在电脑前，一份一份扫描、编辑、上传。但他的手指偶尔会停住——在备注栏里，他额外打下一行字:某强迫症来访者在描述症状时反复搓手指，指尖发红；某抑郁症来访者在提到“父亲”时语速突然从正常降至极慢。
        emotion: ''
      - beat_id: b022
        type: narration
        text: 这些不是系统要求的内容，但他觉得以后可能会有用。他也不知道为什么这么笃定。
        emotion: ''
      - beat_id: b023
        type: action
        text: 林静偶尔从办公室门口路过，瞥一眼他的屏幕，什么也没说。嘴角有一丝几乎察觉不到的松动。
        emotion: ''
      - beat_id: b024
        type: action
        text: 一周后，下午。林静推开咨询室的门，示意陈知律进来。咨询椅上坐着一位中年女人和她十六岁的女儿——化名“小鹿”。女孩低着头，长发遮住半张脸，手腕上缠着一条浅色丝巾。林静在对面坐下，声音平稳而温和，像一张柔软但结实的网。
        emotion: ''
      - beat_id: b025
        type: action
        text: 访谈持续五十分钟。小鹿从沉默、摇头、只蹦单字，到后来捂着脸断断续续挤出话。
        emotion: ''
      - beat_id: b026
        type: dialogue
        text: 我就是……觉得自己很脏。
        speaker_ref: c003
        emotion: ''
      - beat_id: b027
        type: action
        text: 陈知律坐在角落，笔尖在本子上快速移动，没有停过。
        emotion: ''
      - beat_id: b028
        type: action
        text: 访谈结束，林静送走母女。门关上的一刻，咨询室静下来。陈知律还在原处，手里的笔悬在半空。林静走回来，靠着门框。
        emotion: ''
      - beat_id: b029
        type: dialogue
        text: 你的感受？
        speaker_ref: c002
        emotion: ''
      - beat_id: b030
        type: action
        text: 陈知律抬起头，几乎没有停顿。
        emotion: ''
      - beat_id: b031
        type: dialogue
        text: 她不是厌学。她对学校没有明显的负面情绪，提到同学关系时也没有回避回避。她真正卡住的地方是家庭——她母亲提到“爸爸”的时候，她身体明显僵硬了。两次，都是。
        speaker_ref: c001
        emotion: ''
      - beat_id: b032
        type: action
        text: 林静微微眯起眼睛，沉默片刻。然后她开口，语气平淡，却像钉子一样敲进空气里。
        emotion: ''
      - beat_id: b033
        type: dialogue
        text: 你观察得很准。但是陈知律，在这个行业里，看得准不是最难的。
        speaker_ref: c002
        emotion: ''
      - beat_id: b034
        type: action
        text: 她停了一下。
        emotion: ''
      - beat_id: b035
        type: dialogue
        text: 最难的是看完之后，你还能好好吃饭、好好睡觉。
        speaker_ref: c002
        emotion: ''
      - beat_id: b036
        type: action
        text: 陈知律握着笔的手指轻微收紧。他没有回答。
        emotion: ''
      - beat_id: b037
        type: action
        text: 深夜，出租屋。厨房灯光惨白。一锅水烧开，陈知律把面饼放进去，在锅边站了一会儿，又打了一个鸡蛋。他端着碗坐到桌前，吃面的声音在空旷的房间里单调地回响。面汤的热气蒙上他的眼睛，他没有擦，任由雾气凝结成细小水珠，又慢慢消散在灯光里。
        emotion: ''
      - beat_id: b038
        type: action
        text: 手机在桌上震动一下。屏幕亮起，周也的微信头像弹出一条消息。
        emotion: ''
