    - scene_id: s004
      title: 父亲的影子
      chapter_refs:
      - ch04
      time_of_day: day
      objective: 但父亲不相信，他开始失眠，开始发脾气，开始把自己…
      summary: 陈知律在心禾心理录入档案时，发现了三年前父亲陈建军的来访记录，记忆与情感瞬间决堤。他没有惊动任何人，只是安静地完成工作，然后在夜色中独坐。
      beats:
      - beat_id: b001
        type: action
        text: 明德大学附属医院心禾心理中心档案室，白天。日光灯惨白，空调低频轰鸣。陈知律坐在工位前，电脑屏幕的光映在他脸上。档案录入页面，光标在“来访者编号”一栏闪烁。他的手指悬在键盘上方。
        emotion: ''
      - beat_id: b002
        type: narration
        text: 录入档案的第二周，陈知律遇到了一份特殊的记录。来访者编号XH-2019-042，时间是三年前的夏天。主诉——“焦虑状态、疑病倾向”。病程描述一栏写着：来访者长期怀疑自己患有严重疾病，反复就医检查，无法接受无器质性病变的诊断结果，严重影响日常生活。这些描述本身并不特殊。特殊的是来访者的名字——陈建军。
        emotion: ''
      - beat_id: b003
        type: action
        text: 陈知律的手指没有落下。他盯着屏幕上“陈建军”三个字，眼睛里没有任何表情，只有一种极细微的、像是被慢慢勒紧的死寂。他往下滚动页面，看到更多信息。
        emotion: ''
      - beat_id: b004
        type: narration
        text: 来访者职业：建筑工人。家庭状况：已婚，育有一子。经济状况：欠佳，因看病频繁已无积蓄。转介来源：综合医院心理科。
        emotion: ''
      - beat_id: b005
        type: action
        text: 陈知律慢慢靠在椅背上，眼睛还停留在屏幕上，但目光已经透过屏幕，回到了另一个时间。
        emotion: ''
      - beat_id: b006
        type: action
        text: 闪回——初三那年，傍晚，陈家简陋的客厅。陈建军坐在饭桌边，脸色蜡黄，手里攥着一叠化验单。母亲站在厨房门口，围裙上没有擦干的手紧紧攥着。
        emotion: ''
      - beat_id: b007
        type: dialogue
        text: “说了没事，你偏要去查，查了也没事，你又不信。”
        speaker_ref: c002
        emotion: ''
      - beat_id: b008
        type: action
        text: 陈建军： “他们查错了。我胃里有个东西，我能感觉到。它就在那里。”
        emotion: ''
      - beat_id: b009
        type: dialogue
        text: “医生说了没有，你还要怎样？”
        speaker_ref: c002
        emotion: ''
      - beat_id: b010
        type: action
        text: 陈建军没有回答。他站起来，把化验单一把塞进抽屉，走进卧室，关上了门。门锁咔哒一声。陈知律站在走廊尽头，抱着书包，看着那扇紧闭的门。
        emotion: ''
      - beat_id: b011
        type: action
        text: 转回现在——档案室。陈知律的指尖在桌沿划了一下，碰到了冰冷的金属水杯。他端起杯子，喝了一口水，放下，然后重新把手放回键盘上。
        emotion: ''
      - beat_id: b012
        type: narration
        text: 他发现父亲没有被正确诊断过抑郁。那些量表、那些访谈、那些按小时收费的咨询，对一个建筑工人来说太奢侈了——一天工钱两百块，不够做一次心理咨询。
        emotion: ''
      - beat_id: b013
        type: action
        text: 陈知律慢慢在键盘上敲击。他打字的速度先是正常，然后越来越快，像在追赶什么。
        emotion: ''
      - beat_id: b014
        type: action
        text: 闪回——初中教室，班主任走到陈知律身边，表情克制而沉重。周围同学的目光好奇而惶恐。班主任的手放在他肩上。
        emotion: ''
      - beat_id: b015
        type: action
        text: 班主任： “陈知律，你出来一下。你家里……出了点事。”
        emotion: ''
      - beat_id: b016
        type: action
        text: 陈知律抬起头，看着班主任的脸。教室里钟声滴答。他没有问是什么事。他只是站起来，书包带子从桌沿滑下去，拖着地面走出去。
        emotion: ''
      - beat_id: b017
        type: action
        text: 转回现在——档案录入窗口。陈知律打完了最后一行。光标闪烁片刻，他移动鼠标，在备注栏里多加了一行字：“建议关注该来访者家族史及长期情绪状态，可能存在未被识别的抑郁发作。”
        emotion: ''
      - beat_id: b018
        type: action
        text: 他提交了档案。屏幕刷新，新记录上线。他端起水杯，站起来，走到饮水机旁，接了一杯凉水。他一口气喝完，没有停下来喘气。喝完，他把纸杯捏扁，丢进垃圾桶，走回工位，打开下一份档案。手指敲击键盘的速度，比平时快了那么一点点，像在和什么东西赛跑。
        emotion: ''
      - beat_id: b019
        type: action
        text: 林静从走廊经过，从半开的门缝里看见陈知律的背影。他背脊笔直地坐在工位上，键盘声密集而精准，比平时更急促。她停下脚步，看了两秒。没有打扰他。她转身走开，脚步声轻得没有惊动任何人。
        emotion: ''
      - beat_id: b020
        type: narration
        text: 但那天下班后，陈知律没有像往常一样直接回家。
        emotion: ''
      - beat_id: b021
        type: action
        text: 夜晚，心禾心理门口台阶上。法桐叶在路灯下沙沙作响。陈知律坐在台阶最下方一格，秋天的夜风把薄外套吹得贴住后背。他拿出手机，点开微信，翻到最底端一个灰色头像的对话框。最后一条语音消息的时间显示为六年前——只有几秒钟。
        emotion: ''
      - beat_id: b022
        type: action
        text: 他戴上耳机，点下播放键。一个男人的声音从耳机里传来，略带疲惫但语气温和：
        emotion: ''
      - beat_id: b023
        type: action
        text: '陈建军（录音）: “知律啊，爸今天发工资了，给你转了两千，你买点好吃的。”'
        emotion: ''
      - beat_id: b024
        type: action
        text: 语音播放完毕。陈知律没有立刻关掉手机。屏幕的光映在他眼睛里，亮了一小片。他抬头看天。城市的夜空灰蒙蒙的，看不到星星。他坐在那里，很久没有起身。耳机线垂在膝盖上，被风吹得轻轻晃动。
        emotion: ''
      transitions:
        next_scene_hint: 实习第三周，林静给陈知律安排了他的第一个来访者。 与其说是来访者，不如说是“陪练”——对方是林静多年的一位老来访者，情况稳定，愿意配合实习生的练习性访谈。
        transition_type: cut
      source_refs:
      - chapter_id: ch04
        excerpt_id: p001
    - scene_id: s005
      title: 第一个来访者
      chapter_refs:
      - ch05
      time_of_day: day
      objective: 但陈知律注意到，她进门后第一件事是扫视整个房间—…
      summary: 实习第三周的周四上午，陈知律迎来了他的第一个来访者——一位表情温和却在进门时扫视了整个房间的中年女人。
      beats:
      - beat_id: b001
        type: action
        text: 明德大学附属医院心理中心的小咨询室。房间约十平米，靠墙两张浅灰色布艺沙发呈九十度摆放，中间一张小圆木茶几，上面放着一盒白色纸巾和一杯白开水。窗帘半开，午后的阳光斜斜铺了一小截在木地板上。
        emotion: ''
      - beat_id: b002
        type: action
        text: 陈知律坐在靠门一侧的沙发上，穿白衬衫，袖口卷到小臂中段。他低头看手机上的倒计时——距约定时间还有十七分钟。他抬起头，又看了一眼那把空沙发，然后站起来，走过去，把沙发的角度微微调了一点，退后半步看了看，又调回原来的位置。
        emotion: ''
      - beat_id: b003
        type: action
        text: 他坐回自己位置，深呼吸三次，第三次吸到一半的时候没忍住，咳了一声。
        emotion: ''
      - beat_id: b004
        type: action
        text: 敲门声响了。不重，三下，间隔均匀。
        emotion: ''
      - beat_id: b005
        type: action
        text: 陈知律站起身，走到门前，手搭上门把手时停了一秒，才拧开。
        emotion: ''
      - beat_id: b006
        type: dialogue
        text: （声音略紧）请进。
        speaker_ref: c001
        emotion: ''
      - beat_id: b007
        type: action
        text: 门推开，进来一个四十多岁的女人，短发齐耳，淡妆，卡其色薄风衣敞开穿，内搭黑色高领针织衫。她进门后没有看陈知律，目光先扫过天花板四角，然后快速掠过窗帘与墙壁之间的缝隙，最后落向门口后方——那是门背后的盲区。整个过程不超过两秒，连贯、习惯性、几乎没有停顿。
        emotion: ''
      - beat_id: b008
        type: action
        text: 女人收回目光，对陈知律笑了笑。
        emotion: ''
      - beat_id: b009
        type: dialogue
        text: 你好，我是赵敏，林老师应该跟你说过了。
        speaker_ref: c002
        emotion: ''
      - beat_id: b010
        type: dialogue
        text: 对，赵女士，你好。我是陈知律，你可以叫我小陈。
        speaker_ref: c001
        emotion: ''
      - beat_id: b011
        type: action
        text: 陈知律没有伸手。他侧身让出空间，做了个“请”的手势。
        emotion: ''
      - beat_id: b012
        type: dialogue
        text: 谢谢你愿意参与这次练习。我们的时间大概三十分钟，你想聊什么都可以，不想聊的可以直接跳过，不用勉强。
        speaker_ref: c001
        emotion: ''
      - beat_id: b013
        type: action
        text: 女人坐在靠窗一侧的沙发上，没有立刻落座，而是先用手拂了一下沙发扶手的位置——像是确认上面没有东西。然后才拢了拢风衣下摆坐下，坐得很稳，脊背挺直，两条小腿微微偏向一侧。
        emotion: ''
      - beat_id: b014
        type: action
        text: 她打量了一下陈知律。
        emotion: ''
      - beat_id: b015
        type: dialogue
        text: 林老师说你虽然年轻，但很专业。
        speaker_ref: c002
        emotion: ''
      - beat_id: b016
        type: action
        text: 女人顿了一下。
        emotion: ''
      - beat_id: b017
        type: dialogue
        text: 现在看来，不止专业，还很紧张。
        speaker_ref: c002
        emotion: ''
      - beat_id: b018
        type: dialogue
        text: （一顿）很明显吗？
        speaker_ref: c001
        emotion: ''
      - beat_id: b019
        type: dialogue
        text: 你呼吸的频率变了，从我说第一句话之后。
        speaker_ref: c002
        emotion: ''
      - beat_id: b020
        type: action
        text: 女人拿了纸巾但没有用，只是捏在手里。
        emotion: ''
      - beat_id: b021
        type: dialogue
        text: 不过没关系，我不介意。
        speaker_ref: c002
        emotion: ''
      - beat_id: b022
        type: action
        text: 陈知律点了点头，把桌上的水杯往她那边推了推。
        emotion: ''
      - beat_id: b023
        type: dialogue
        text: 那……你今天想聊些什么？任何话题都可以。
        speaker_ref: c001
        emotion: ''
      - beat_id: b024
        type: dialogue
        text: （沉默三秒）最近睡得不好。越来越差了。
        speaker_ref: c002
        emotion: ''
      - beat_id: b025
        type: dialogue
        text: 差到什么程度？
        speaker_ref: c001
        emotion: ''
      - beat_id: b026
        type: dialogue
        text: （轻轻摇头）入睡倒不难，难的是不醒。凌晨两点、三点、四点，每个小时醒一次。醒了就很久睡不着，脑子里一直转，转的都是没用的东西。
        speaker_ref: c002
        emotion: ''
      - beat_id: b027
        type: action
        text: 女人手指在纸巾边缘来回捻着。
        emotion: ''
      - beat_id: b028
        type: dialogue
        text: 总觉得有什么不好的事情要发生，但又说不清楚是什么事。
        speaker_ref: c002
        emotion: ''
      - beat_id: b029
        type: dialogue
        text: 这种感觉，从什么时候开始的？
        speaker_ref: c001
        emotion: ''
      - beat_id: b030
        type: dialogue
        text: （手指停住）大概……三年前。
        speaker_ref: c002
        emotion: ''
      - beat_id: b031
        type: dialogue
        text: 三年前你生活中发生了什么？
        speaker_ref: c001
        emotion: ''
      - beat_id: b032
        type: action
        text: 房间安静下来。空调的出风口嗡嗡响，窗帘动了一下。
        emotion: ''
      - beat_id: b033
        type: action
        text: 女人看着茶几上的那杯水，没有抬头。
        emotion: ''
      - beat_id: b034
        type: action
        text: 她一直安静了将近三十秒。陈知律没有动，身体微微前倾，目光落在她肩膀而不是眼睛上。
        emotion: ''
      - beat_id: b035
        type: dialogue
        text: （终于开口，声音低了很多）我离婚了。
        speaker_ref: c002
        emotion: ''
      - beat_id: b036
        type: action
        text: 陈知律没有说话。
        emotion: ''
      - beat_id: b037
        type: dialogue
        text: 他出轨。我们吵了将近一年，最后我赢了——房子归我，儿子归我。但自从那以后……
        speaker_ref: c002
        emotion: ''
      - beat_id: b038
        type: action
        text: 她抬起一只手，指尖对着空气画了一个小圈。
        emotion: ''
      - beat_id: b039
        type: dialogue
        text: 就变成了这样。每天晚上锁门要锁两遍，出门走到半路要折回来确认煤气有没有关。我知道这些行为不合理，控制不住。
        speaker_ref: c002
        emotion: ''
      - beat_id: b040
        type: dialogue
        text: （安静地）离婚对你来说不是一个事件的结束，而是一种新生活方式的开始。这种生活方式里，安全感是需要重新建立的。
        speaker_ref: c001
        emotion: ''
      - beat_id: b041
        type: action
        text: 女人抬起头，目光在陈知律脸上停住。她没有说话，但眼眶微微红了一下，很快又控制住。
        emotion: ''
      - beat_id: b042
        type: dialogue
        text: （把纸巾放回桌上，声音平静下来）小陈，你会是一个很好的咨询师。
        speaker_ref: c002
        emotion: ''
      - beat_id: b043
        type: action
        text: 三十分钟到了。陈知律站起来，女人也站起来，整理了一下风衣的肩线和领口。她走到门口，忽然回头看了一眼陈知律。
        emotion: ''
      - beat_id: b044
        type: dialogue
        text: 你刚才那句话，林老师没教过你吧？
        speaker_ref: c002
        emotion: ''
      - beat_id: b045
        type: dialogue
        text: （摇头）没有。我临时想的。
        speaker_ref: c001
        emotion: ''
      - beat_id: b046
        type: dialogue
        text: 那你挺有天赋的。
        speaker_ref: c002
        emotion: ''
      - beat_id: b047
        type: action
        text: 女人拉开门走了出去。走廊里响起平缓的脚步声，逐渐远去。
        emotion: ''
      - beat_id: b048
        type: action
        text: 门关上。陈知律站在咨询室中间，没有动。他低头看了一眼自己的手，微微发凉。然后他坐下，拿起保温杯喝了一口水，盖上盖子，在还剩一口气的时候忽然停下。
        emotion: ''
      - beat_id: b049
        type: action
        text: 他想起父亲。
        emotion: ''
      - beat_id: b050
        type: action
        text: 那个从来没有被人认真倾听过、也从来不知道如何开口的人。
        emotion: ''
      - beat_id: b051
        type: narration
        text: 实习第三周，陈知律完成了他的第一个来访者访谈。他不知道自己做得好不好，但他知道，等他回到病房，他不会告诉母亲今天发生了什么。
        emotion: ''
      transitions:
        next_scene_hint: 'CUT TO:'
        transition_type: cut
      source_refs:
      - chapter_id: ch05
        excerpt_id: p001
    - scene_id: s006
      title: 两个失眠的人
      chapter_refs:
      - ch06
      time_of_day: night/early dawn
      objective: 三块之外的所有时间，都属于睡眠——但睡眠不属于他
      summary: 凌晨三点，陈知律在出租屋里经历又一次失眠。周也发来自拍和消息，两个学心理的人在黑夜里交换了一段关于恐惧的对话。
      beats:
      - beat_id: b001
        type: narration
        text: 研究生开学后的第一个月，陈知律的时间被切成三块：上课，心禾实习，医院陪护。三块之外的所有时间，都属于睡眠——但睡眠不属于他。他已经连续两周每天只睡四五个小时了。
        emotion: ''
      - beat_id: b002
        type: action
        text: 凌晨两点四十五分，出租屋。陈知律平躺在床上，眼睛睁着。天花板上有道裂缝，从墙角蜿蜒到灯泡附近。
        emotion: ''
      - beat_id: b003
        type: dialogue
        text: 陈知律的呼吸声
        speaker_ref: c001
        emotion: ''
      - beat_id: b004
        type: action
        text: 他翻了个身，从侧卧变成平躺，又从平躺翻向另一侧。床垫发出嘎吱的声响。窗外的路灯把树影投在窗帘上，像一片巨大的黑色静脉。
        emotion: ''
      - beat_id: b005
        type: narration
        text: 入睡不难。难的是凌晨两三点准时醒来。醒来之后再也睡不着。脑海里开始自动播放——父亲的语音，母亲的病历，心禾档案库里那些密密麻麻的来访者记录。
        emotion: ''
      - beat_id: b006
        type: action
        text: 陈知律闭上眼睛，又睁开。手机就在枕头边，屏幕朝上。他没有碰它。
        emotion: ''
      - beat_id: b007
        type: action
        text: 凌晨四点十二分。他已经翻了第十八次身。楼上传来拖鞋的声音，咚咚咚，从客厅走到卧室，又从卧室走到厕所。
        emotion: ''
      - beat_id: b008
        type: action
        text: 手机屏幕忽然亮了。不是闹钟，是微信消息提示音。一把短促的震动。
        emotion: ''
      - beat_id: b009
        type: action
        text: 陈知律拿起手机。通知栏显示：周也发来一张图片。
        emotion: ''
      - beat_id: b010
        type: action
        text: 他点开消息。图片是周也的自拍——她穿着睡衣，头发乱糟糟地扎成一个丸子，黑眼圈从眼睛下方延伸到颧骨的位置。她在照片里翻了个白眼，表情介于无奈和自嘲之间。配文：“睡不着的人不止你一个。”
        emotion: ''
      - beat_id: b011
        type: action
        text: 陈知律盯着那张照片看了几秒。出租屋安静得只剩下楼上的拖鞋声。他的嘴角动了一下。
        emotion: ''
      - beat_id: b012
        type: dialogue
        text: （打字，发送）？
        speaker_ref: c001
        emotion: ''
      - beat_id: b013
        type: action
        text: 对面几乎秒回。
        emotion: ''
      - beat_id: b014
        type: dialogue
        text: 失眠。
        speaker_ref: c002
        emotion: ''
      - beat_id: b015
        type: action
        text: （看着屏幕，等了一会儿，又打了两个字）多久了？
        emotion: ''
      - beat_id: b016
        type: dialogue
        text: 我妈说我可能有病，让我去看看心理医生。我说我就是学心理的，我有病我自己还不知道吗？
        speaker_ref: c002
        emotion: ''
      - beat_id: b017
        type: dialogue
        text: （犹豫了一下）那你去看过吗？
        speaker_ref: c001
        emotion: ''
      - beat_id: b018
        type: dialogue
        text: 没有。我怕确诊了毕不了业。
        speaker_ref: c002
        emotion: ''
      - beat_id: b019
        type: action
        text: 陈知律把手机握在手里，拇指悬在屏幕上方。他打了一行字，删掉。又打了一行，又删掉。最后只回了一句。
        emotion: ''
      - beat_id: b020
        type: dialogue
        text: 去看吧。确诊不确诊，你都还是你。
        speaker_ref: c001
        emotion: ''
      - beat_id: b021
        type: action
        text: 对面沉默了很久。陈知律盯着那个“对方正在输入”的提示亮了，又灭了。他以为她睡着了。
        emotion: ''
      - beat_id: b022
        type: dialogue
        text: 陈知律，你有没有觉得我们很可笑？学心理的人最怕看心理医生，就像医生最怕体检。
        speaker_ref: c002
        emotion: ''
      - beat_id: b023
        type: action
        text: 陈知律没有立刻回答。他把手机放回枕头边，盯着天花板。楼上的拖鞋声停了。隔壁有人在打鼾。
        emotion: ''
      - beat_id: b024
        type: narration
        text: 他学了四年心理学，背了一整本变态心理学，能熟练地说出抑郁症的诊断标准和治疗指南。但他从不让任何人在他身上使用那些工具。不是不信任，是不敢。有些东西一旦被打开，他不知道该怎么关上。
        emotion: ''
      - beat_id: b025
        type: action
        text: 他重新拿起手机。
        emotion: ''
      - beat_id: b026
        type: dialogue
        text: 周也。
        speaker_ref: c001
        emotion: ''
      - beat_id: b027
        type: dialogue
        text: 嗯？
        speaker_ref: c002
        emotion: ''
      - beat_id: b028
        type: dialogue
        text: 去睡吧，明天还有早课。
        speaker_ref: c001
        emotion: ''
      - beat_id: b029
        type: dialogue
        text: ……你也知道明天有早课？你赶紧睡，你现在就给我关机。
        speaker_ref: c002
        emotion: ''
      - beat_id: b030
        type: dialogue
        text: 嘴角微微动了一下。
        speaker_ref: c001
        emotion: ''
      - beat_id: b031
        type: action
        text: 他没有关机。他把手机放在枕头边，闭上眼睛。屏幕暗下去之后，房间里重新陷入黑暗和安静。出租屋隔音很差——楼上的人在走动，隔壁的人在打鼾，远处偶尔传来汽车的喇叭声。
        emotion: ''
      - beat_id: b032
        type: narration
        text: 这些声音交织在一起，像一张粗糙的安全网，把他从那些纷乱的念头里暂时兜住了。
        emotion: ''
      - beat_id: b033
        type: action
        text: 陈知律被闹钟叫醒。他发现自己握在手里的手机屏幕上，还留着一个没有发出去的草稿。草稿只有四个字：“谢谢你啊。”他没有点发送。
        emotion: ''
      - beat_id: b034
        type: action
        text: 他坐起来，把手机揣进口袋，翻身下床。窗外是灰蓝色的天，远处有鸟叫。新的一天，三块时间要从第一块上课开始。
        emotion: ''
      transitions:
        next_scene_hint: 清晨七点，闹钟响。
        transition_type: cut
      source_refs:
      - chapter_id: ch06
        excerpt_id: p001
    - scene_id: s007
      title: 裂痕
      chapter_refs:
      - ch07
      time_of_day: day
      objective: 你母亲今天上午出现了急性呼吸困难，我们正在进行对…
      summary: 十月中旬，陈知律在课堂上接到医院电话，得知母亲病情加重，他赶往医院面对新的诊断和费用压力，却依然强撑平静，去完成心禾心理的工作。
      beats:
      - beat_id: b001
        type: action
        text: 明德大学教学楼，阶梯教室。午后的阳光从高窗外斜射进来，尘埃在光柱里浮动。陈知律站在讲台前，手里的遥控器停在PPT最后一页。投影上是一行案例分析的结论。教室里安静了三秒。
        emotion: ''
      - beat_id: b002
        type: dialogue
        text: 以上就是我的案例汇报，请大家指正。
        speaker_ref: c001
