        type: action
        text: 周也的动作顿住了。她正把最后一个酸奶往冰箱门上放，那只手停在半空。
        emotion: ''
      - beat_id: b032
        type: dialogue
        text: 我认识一个很好的咨询师。在心禾那边。如果你愿意的话，我可以帮你约。
        speaker_ref: c001
        emotion: ''
      - beat_id: b033
        type: action
        text: 周也转过头看着他。她没有立刻说话，目光里掠过某种复杂的东西——像是被戳穿了，又像是一种终于等到这时刻的释然。她嘴角慢慢弯起来。
        emotion: ''
