        type: dialogue
        text: 吃饭了没有？
        speaker_ref: c002
        emotion: ''
      - beat_id: b013
        type: dialogue
        text: 吃了。
        speaker_ref: c001
        emotion: ''
      - beat_id: b014
        type: dialogue
        text: 嗯。那就好。
        speaker_ref: c002
        emotion: ''
      - beat_id: b015
        type: action
        text: 电话挂断。陈知律看着黑掉的手机屏，片刻后把手机搁在桌上。
        emotion: ''
      - beat_id: b016
        type: action
        text: 门锁传来电子解锁声——滴的一声，门被推开了。周也拎着两大袋东西走进来。她看到陈知律站在厨房门口的轮廓，愣了一下。
        emotion: ''
      - beat_id: b017
        type: action
        text: c003（周也）：你没死啊。
        emotion: ''
      - beat_id: b018
        type: dialogue
        text: 差一点。
        speaker_ref: c001
        emotion: ''
      - beat_id: b019
        type: action
        text: c003（周也）：闭嘴。
        emotion: ''
      - beat_id: b020
        type: action
        text: 周也不看他，径直走向冰箱。打开冰箱门，里面几乎是空的，只有一盒过期的牛奶和半瓶老干妈。她把袋子里的东西一件一件往里塞：水果、酸奶、面包、速冻水饺、两盒自热米饭。
