  - chapter_id: ch05
    title: 第五章 第一个来访者
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 实习第三周，林静给陈知律安排了他的第一个来访者。 与其说是来访者，不如说是“陪练”——对方是林静多年的一位老来访者，情况稳定，愿意配合实习生的练习性访谈。
    excerpt_count: 1
  - chapter_id: ch06
    title: 第六章 两个失眠的人
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 研究生开学后的第一个月，陈知律的时间被切成三块：上课、心禾实习、医院陪护。 三块之外的所有时间，都属于睡眠——但睡眠不属于他。
    excerpt_count: 1
  - chapter_id: ch07
    title: 第七章 裂痕
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 十月中旬，陈母的病情突然加重了。 陈知律是在课堂上接到医院电话的。
    excerpt_count: 1
  - chapter_id: ch08
    title: 第八章 周也的秘密
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 周也发现陈知律最近不太对劲，是在一个周三的下午。 那天没有课，她去心禾心理找陈知律——她打听了很久才从系里一个学姐那里问到这个地址。
    excerpt_count: 1
  - chapter_id: ch09
    title: 第九章 临界点
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 十一月的最后一周，陈知律崩溃了。 不是在医院，不是在咨询室，也不是在上课的时候。
    excerpt_count: 1
  - chapter_id: ch10
    title: 第十章 梧桐树下
    raw_text_ref: .novel2script\_uploads\未命名剧本_20260620032307.txt
    summary: 陈知律请了三天假。 三天里，他什么都没有做。
    excerpt_count: 1
