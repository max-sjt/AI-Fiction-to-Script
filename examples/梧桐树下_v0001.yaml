story_bible:
  logline: 未命名剧本围绕主要人物逐步揭开核心冲突并推动故事升级。
  synopsis: 陈知律站在明德大学附属医院的走廊尽头，手里攥着那份烫金录取函，指尖微微发白。 走廊很长，日光灯管把白色的墙壁照得惨白，偶尔有护士推着小车从身边经过，车轮碾过地面发出细碎的声响。
    陈知律第二天早上八点四十就到了心禾心理。 玻璃门上挂着“休息中”的牌子，透过门缝能看到里面正在打扫的林静。 周也是陈知律大学四年唯一的“熟人”。 说“熟人”不太准确，因为周也单方面把他定义为“最好的朋友”，而陈知律从来没有正面回应过这个定义。
    录入档案的第二周，陈知律遇到了一份特殊的记录。 来访者编号是XH-2019-042，时间是三年前的夏天。 实习第三周，林静给陈知律安排了他的第一个来访者。
    与其说是来访者，不如说是“陪练”——对方是林静多年的一位老来访者，情况稳定，愿意配合实习生的练习性访谈。 研究生开学后的第一个月，陈知律的时间被切成三块：上课、心禾实习、医院陪护。
    三块之外的所有时间，都属于睡眠——但睡眠不属于他。 十月中旬，陈母的病情突然加重了。 陈知律是在课堂上接到医院电话的。 周也发现陈知律最近不太对劲，是在一个周三的下午。
    那天没有课，她去心禾心理找陈知律——她打听了很久才从系里一个学姐那里问到这个地址。 十一月的最后一周，陈知律崩溃了。 不是在医院，不是在咨询室，也不是在上课的时候。
    陈知律请了三天假。 三天里，他什么都没有做。
