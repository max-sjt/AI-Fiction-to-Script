story:
  logline: 老街回声围绕主要人物逐步揭开核心冲突并推动故事升级。
  synopsis: 林然在老街咖啡馆守到打烊，窗外的雨把街灯晕成一片模糊的光。 姐姐林薇失踪已经七天，他却只收到一条没有署名的短信：如果想知道真相，就去旧仓库。
    旧仓库在河堤后面，铁门半掩，里面居然还亮着昏黄的灯。 林然刚踏进去，就看见调查记者沈青站在货架边翻找资料。 循着录音里的地址，林然和沈青赶到旧城区天台。 风很大，霓虹灯从楼缝里切进来，把每个人的脸都照得忽明忽暗。
  themes:
  - 真相
  props:
  - 短信
  - 林然在老街咖
  - 啡馆守到打烊
  - 旧仓库在河堤
  - 后面
