[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fiction-to-script"
version = "0.4.0"
description = "A modular Qwen-powered tool that converts multi-chapter fiction into editable YAML screenplays."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "孙蒋泰", email = "2942661276@qq.com" }
]
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.11.5",
  "pyyaml>=6.0.2",
  "redis>=6.2.0",
  "rich>=14.0.0",
  "typer>=0.16.0"
]

[project.scripts]
novel2script = "ai_fiction_to_script.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_fiction_to_script.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
