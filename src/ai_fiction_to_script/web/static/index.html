<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Fiction to Script Workbench</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="background-orb orb-a"></div>
    <div class="background-orb orb-b"></div>
    <header class="hero">
      <div>
        <p class="eyebrow">AI Fiction to Script</p>
        <h1 data-i18n="heroTitle">Qwen 剧本生成工作台</h1>
        <p class="hero-copy" data-i18n="heroCopy">
          上传小说文件或直接粘贴正文，调用通义千问生成不同类型、不同语气的结构化剧本，并支持场景级重生成。
        </p>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar card">
        <div class="sidebar-controls">
          <label class="language-switcher">
            <span data-i18n="languageLabel">界面语言</span>
            <select id="languageSelect">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <div class="hero-status">
            <span class="status-dot"></span>
            <span id="statusText" data-i18n="loadingWorkspace">正在加载工作区...</span>
          </div>
        </div>
        <div class="section-heading">
          <h2 data-i18n="projectsHeading">项目</h2>
          <div class="section-actions">
            <button id="resetProjectsButton" class="ghost-button" data-i18n="resetButton">重置</button>
            <button id="refreshProjectsButton" class="ghost-button" data-i18n="refreshButton">刷新</button>
          </div>
        </div>
        <div id="projectsList" class="project-list"></div>
      </aside>

      <section class="content">
        <div id="messageBanner" class="message-banner hidden"></div>

        <section class="card section-card">
          <div class="section-heading">
            <h2 data-i18n="generateHeading">生成剧本</h2>
            <span class="pill" data-i18n="qwenPill">Qwen 生成</span>
          </div>
          <div class="form-grid">
            <label class="full-width">
              <span data-i18n="apiKeyLabel">Qwen API Key</span>
              <input id="apiKey" type="password" data-i18n-placeholder="apiKeyPlaceholder" placeholder="请输入 sk-..." />
            </label>
            <label class="full-width">
              <span data-i18n="uploadLabel">上传小说文件（txt / doc / docx）</span>
              <input id="uploadFile" type="file" accept=".txt,.doc,.docx" />
            </label>
            <label class="full-width">
              <span data-i18n="yamlBundleLabel">上传剧本 YAML（.yaml / .yml）</span>
              <input id="uploadYamlFile" type="file" accept=".yaml,.yml" />
            </label>
            <label>
              <span data-i18n="titleLabel">剧本标题</span>
              <input id="title" type="text" />
            </label>
            <label>
              <span data-i18n="authorLabel">原著作者</span>
              <input id="author" type="text" />
            </label>
            <label>
              <span data-i18n="originalTitleLabel">原著标题</span>
              <input id="originalTitle" type="text" />
            </label>
            <label>
              <span data-i18n="scriptTypeLabel">生成剧本类型</span>
              <select id="scriptType"></select>
            </label>
            <label>
              <span data-i18n="genreLabel">题材</span>
              <input id="genre" type="text" />
            </label>
            <label>
              <span data-i18n="toneLabel">语气风格</span>
              <select id="tone"></select>
            </label>
            <label class="full-width">
              <span data-i18n="pasteTextLabel">直接粘贴小说文本</span>
              <textarea
                id="novelText"
                rows="8"
                data-i18n-placeholder="novelTextPlaceholder"
                placeholder="如果不上传文件，可以在这里粘贴一章或多章小说正文；多章生成会更稳定。"
              ></textarea>
            </label>
          </div>
          <div class="action-row">
            <button id="generateButton" class="primary-button" data-i18n="generateButton">生成剧本</button>
            <button id="regenerateFromYamlButton" class="secondary-button" data-i18n="regenerateFromYamlButton">根据 YAML 重生成</button>
          </div>
        </section>

        <section class="card section-card">
          <div class="section-heading">
            <h2 data-i18n="workspaceHeading">工作区</h2>
            <span class="pill" id="workspacePill" data-i18n="workspaceEmpty">尚未选择项目</span>
          </div>

          <div class="workspace-toolbar">
            <label>
              <span data-i18n="currentProjectLabel">当前项目</span>
              <select id="projectSelect"></select>
            </label>
            <label>
              <span data-i18n="currentVersionLabel">当前版本</span>
              <select id="versionSelect"></select>
            </label>
            <div class="toolbar-actions">
              <button id="reloadVersionButton" class="ghost-button" data-i18n="reloadButton">重新加载</button>
              <button id="downloadYamlButton" class="secondary-button" data-i18n="downloadYamlButton">下载 YAML</button>
            </div>
          </div>

          <div class="script-stage">
            <div class="panel-heading">
              <h3 data-i18n="finalScriptHeading">最终生成剧本</h3>
            </div>
            <pre id="scriptPreview" class="script-preview" data-i18n="scriptPreviewPlaceholder">请上传小说后等待 Qwen 生成剧本</pre>
          </div>
        </section>

        <section class="card section-card">
          <div class="section-heading">
            <h2 data-i18n="sceneRegenerationHeading">场景重生成</h2>
            <span class="pill" data-i18n="targetedRewritePill">定向重写</span>
          </div>
          <div class="form-grid">
            <label>
              <span data-i18n="sceneLabel">场景</span>
              <select id="sceneSelect"></select>
            </label>
            <label class="full-width">
              <span data-i18n="instructionLabel">修改要求</span>
              <textarea
                id="regenInstruction"
                rows="4"
                data-i18n-placeholder="regenInstructionPlaceholder"
                placeholder="描述这个场景需要如何调整。"
              ></textarea>
            </label>
          </div>
          <div class="action-row">
            <button id="regenerateButton" class="primary-button" data-i18n="regenerateButton">重生成场景</button>
          </div>

          <div class="comparison-stage">
            <div class="panel-heading">
              <h3 data-i18n="sceneComparisonHeading">修改前后对比</h3>
              <span class="pill" data-i18n="comparisonResultPill">结果对比</span>
            </div>
            <div class="comparison-card">
              <strong data-i18n="comparisonInstructionLabel">修改要求</strong>
              <p id="sceneComparisonInstruction" class="comparison-instruction">重生成场景后，这里会显示修改前后对比。</p>
            </div>
            <div class="comparison-grid">
              <div class="comparison-card">
                <h4 data-i18n="comparisonBeforeLabel">修改前</h4>
                <pre id="sceneBeforePreview" class="comparison-preview">重生成场景后，这里会显示修改前后对比。</pre>
              </div>
              <div class="comparison-card">
                <h4 data-i18n="comparisonAfterLabel">修改后</h4>
                <div class="toolbar-actions">
                  <button id="downloadRegeneratedYamlButton" class="secondary-button" data-i18n="downloadRegeneratedYamlButton">下载修改后 YAML</button>
                </div>
                <pre id="sceneAfterPreview" class="comparison-preview">重生成场景后，这里会显示修改前后对比。</pre>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
